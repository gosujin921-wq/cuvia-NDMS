# @cuvia/* 는 Gitea 레지스트리(designs/.npmrc)에서 받는다.
#
# 여기에 `overrides: '@cuvia/*': link:../../cuvia_platform_design/...` 를 두지 않는다 —
# 그 경로는 개발자 맥에만 있고 lockfile 에 그대로 박히기 때문에, Netlify 빌드 서버가
# `pnpm install --frozen-lockfile` 에서 경로를 못 찾고 죽는다(= 배포 실패).
# DS 를 로컬 클론에 물려 작업할 때는 `pnpm ds:link` 를 쓰고, 그때 더러워진
# pnpm-lock.yaml 은 커밋하지 않는다.

# 이 앱을 독립 워크스페이스 루트로 고정한다(상위 폴더 워크스페이스에 딸려 들어가지 않도록).
#
# verifyDepsBeforeRun: pnpm 11 은 스크립트 실행 전 의존성 최신 여부를 검사하면서 `pnpm install` 을
# 새로 spawn 하는데, 이 환경은 corepack 경유(`corepack pnpm`)만 있고 PATH 에 standalone `pnpm` 이
# 없어 ENOENT 로 죽는다. 검사를 끄면 dev/build/type-check 가 정상 동작한다.
# 의존성이 바뀌면 `corepack pnpm install` 을 직접 실행한다.
verifyDepsBeforeRun: false
